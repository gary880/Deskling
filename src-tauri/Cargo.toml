[package]
name = "deskling"
version = "0.1.0"
description = "A window-aware desktop pet"
authors = ["Deskling contributors"]
license = "UNLICENSED"
repository = "https://github.com/gary880/Deskling"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "deskling_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }
image = { version = "0.24.9", default-features = false, features = ["webp"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset", "tray-icon", "macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
